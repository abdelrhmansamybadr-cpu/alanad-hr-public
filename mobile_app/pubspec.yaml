name: hr_mobile_app
description: "HR Portal Mobile App - Full Flutter implementation"
publish_to: 'none'
version: 1.6.13+25

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Routing
  go_router: ^14.8.1
  
  # HTTP & API
  dio: ^5.8.0+1
  
  # Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  
  # Charts
  fl_chart: ^0.70.2
  
  # File Handling
  file_picker: ^8.3.0
  open_filex: ^4.5.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  
  # UI & Design
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  
  # Permissions
  permission_handler: ^11.4.0
  
  # Utils
  intl: ^0.20.2
  
  # Location & Network
  geolocator: ^11.0.0
  network_info_plus: ^5.0.3
  
  # Icons
  cupertino_icons: ^1.0.8
  package_info_plus: ^9.0.1
  ota_update: ^7.1.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1
  workmanager: ^0.10.10
  flutter_webrtc: ^1.6.2+hotfix.4
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  connectivity_plus: ^7.3.1
  wifi_scan: ^0.5.0
  android_intent_plus: ^6.1.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/i18n/
    - assets/brand/
